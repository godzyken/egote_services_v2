plugins {
    alias(libs.plugins.android.application)
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
//    id "io.sentry.android.gradle"
}

android {
    namespace = "com.godzy.egote_services_v2"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    lintOptions {
        baseline file("lint-baseline.xml")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        manifestPlaceholders = [hostName:"www.egoteservices.com"]
        applicationId = "com.godzy.egote_services_v2"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        debug {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            minifyEnabled = true
            shrinkResources = true
            debuggable = true
            /*applicationIdSuffix = ".debug"*/
            proguardFiles("proguard-android-optimize.txt", "proguard-rules.pro")
        }

        realize {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }

        /**
         * The `initWith` property lets you copy configurations from other build types,
         * then configure only the settings you want to change. This one copies the debug build
         * type, and then changes the manifest placeholder and application ID.
         */
        staging {
            initWith debug
            manifestPlaceholders = [hostName:"internal.egoteservice.com"]
            applicationIdSuffix ".debugStaging"
        }
    }
    // Specifies one flavor dimension.
    flavorDimensions "version"
    productFlavors {
        demo {
            // Assigns this product flavor to the "version" flavor dimension.
            // If you are using only one dimension, this property is optional,
            // and the plugin automatically assigns all the module's flavors to
            // that dimension.
            dimension "version"
            applicationIdSuffix ".demo"
            versionNameSuffix "-demo"
        }
        full {
            dimension "version"
            applicationIdSuffix ".full"
            versionNameSuffix "-full"
        }
  /*      minApi24 {...}
        minApi23 {...}
        minApi21 {...}*/
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        // To check for a certain build type, use variant.buildType.name == "<buildType>"
        if (names.contains("minApi21") && names.contains("demo")) {
            // Gradle ignores any variants that satisfy the conditions above.
            setIgnore(true)
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
//    constraints { api("com.google.guava:guava:30.1-jre") api("org.apache.commons:commons-lang3:3.12.0") }

    implementation(platform(libs.firebase.bom))

    implementation(libs.androidx.ktx)
    implementation(libs.androidx.protolayout)
    implementation(libs.androidx.protolayout.expression)
    implementation(libs.androidx.protolayout.material)
    implementation(libs.androidx.tiles)
    implementation(libs.firebase.auth)
    implementation(libs.firebase.firestore)
}
