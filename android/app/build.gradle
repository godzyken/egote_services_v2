plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Update Android SDK versions here
// Android SDK levels defined here:
// https://developer.android.com/guide/topics/manifest/uses-sdk-element#ApiLevels
def flutterCompileSdkVersion = 35
def flutterMinSdkVersion = 24 // Android 7.0
def flutterTargetSdkVersion = 35

kotlin {
    jvmToolchain(17) // Java version defined here
}


android {

    namespace 'com.godzy.egote_services_v2'
    compileSdk flutterCompileSdkVersion
    ndkVersion = "27.2.12479018"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId 'com.godzy.egote_services_v2'
        testApplicationId 'com.godzy.egote_services_v2.test'
		minSdkVersion flutterMinSdkVersion
        targetSdkVersion flutterTargetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
		
        signingConfig signingConfigs.debug
        multiDexEnabled true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        testFunctionalTest true
        testHandleProfiling true
    }

 /*   signingConfigs {
        debug {
            storeFile file('D:\\gitrepo\\projects\\egote_services_v2\\android\\app\\key.properties')
            keyAlias 'AndroidDebugKey'
            keyPassword 'D4t.ebayo'

        }
    }*/

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            minifyEnabled true
            signingConfig signingConfigs.debug
        }

        profile {
            debuggable true
        }

        debug {
            debuggable true
            testCoverageEnabled false
            jniDebuggable true
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
    implementation(libs.legacy.support.v13)
    implementation(libs.work.runtime)
    implementation(libs.multidex)
    testImplementation(libs.junit.jupiter)
    testRuntimeOnly(libs.junit.platform.launcher)
    implementation(libs.orientdb.core)
}

println("BUILD SCRIPT: This is executed during the configuration phase")


configurations {
    // A configuration meant for consumers that need the API of this component
    create("exposedApi") {
        // This configuration is an "outgoing" configuration, it's not meant to be resolved
        isCanBeResolved()
        // As an outgoing configuration, explain that consumers may want to consume it
        assert(canBeConsumed)
    }
    // A configuration meant for consumers that need the implementation of this component
    create("exposedRuntime") {
        isCanBeResolved()
        assert(canBeConsumed)
    }
   // println("test.extendsFrom():::::::: ${test.extendsFrom()}")
}
