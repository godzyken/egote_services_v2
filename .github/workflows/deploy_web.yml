name: Deploy Flutter Web to Netlify

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shared_models (path packages/shared_models)
        env:
          KEY: ${{ secrets.SHARED_MODELS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "❌ SHARED_MODELS_DEPLOY_KEY est manquant dans les secrets GitHub du dépôt egote_services_v2."
            echo "Veuillez ajouter la clé SSH privée dans GitHub > Settings > Secrets and variables > Actions > SHARED_MODELS_DEPLOY_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh packages
          rm -rf packages/shared_models
          KEY_FILE="$HOME/.ssh/shared_models_ci"

          if [[ "$KEY" != *"BEGIN"* ]] && echo "$KEY" | grep -qE '^[A-Za-z0-9+/=]+$'; then
            echo "$KEY" | base64 -d | tr -d '\r' > "$KEY_FILE"
          elif [[ "$KEY" == *"\\n"* ]] && [[ "$KEY" != *$'\n'* ]]; then
            echo -e "$KEY" | tr -d '\r' > "$KEY_FILE"
          else
            printf '%s\n' "$KEY" | tr -d '\r' > "$KEY_FILE"
          fi

          sed -i -e '$a\' "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git clone --depth 1 --branch master \
              git@github.com:godzyken/shared_models.git \
              "packages/shared_models"

          echo "→ packages/shared_models OK"
          rm -f "$KEY_FILE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --web-renderer canvaskit

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './build/web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
