name: Flutter CI and Netlify Deploy

on:
  push:
    branches:
      - master
      - main
      - dev

  pull_request:
    branches:
      - master
      - main
      - dev

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: egote-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shared_models
        env:
          KEY: ${{ secrets.SHARED_MODELS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${KEY:-}" ]; then
            echo "Missing SHARED_MODELS_DEPLOY_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh packages
          KEY_FILE="$HOME/.ssh/shared_models_ci"

          if [[ "$KEY" != *"BEGIN"* ]] &&
             echo "$KEY" | grep -qE '^[A-Za-z0-9+/=]+$'; then
            echo "$KEY" | base64 -d | tr -d '\r' > "$KEY_FILE"
          elif [[ "$KEY" == *'\n'* ]] &&
               [[ "$KEY" != *$'\n'* ]]; then
            printf '%s' "$KEY" | sed 's/\\n/\n/g' > "$KEY_FILE"
          else
            printf '%s\n' "$KEY" | tr -d '\r' > "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          ssh-keyscan -t ed25519,rsa github.com \
            >> ~/.ssh/known_hosts 2>/dev/null

          GIT_SSH_COMMAND="ssh -i $KEY_FILE \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes" \
            git clone --depth 1 --branch master \
            git@github.com:godzyken/shared_models.git \
            packages/shared_models

          echo "shared_models installed successfully"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify SDK
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Web
        run: flutter build web --release --no-pub

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production to Netlify
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    concurrency:
      group: netlify-production
      cancel-in-progress: false

    steps:
      - name: Download validated Web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: build/web/

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './build/web'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
