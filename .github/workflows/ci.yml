name: CI (Analyze & Test)

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shared_models (path packages/shared_models)
        env:
          KEY: ${{ secrets.SHARED_MODELS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "❌ SHARED_MODELS_DEPLOY_KEY est manquant dans les secrets GitHub du dépôt egote_services_v2."
            echo "Veuillez ajouter la clé SSH privée dans GitHub > Settings > Secrets and variables > Actions > SHARED_MODELS_DEPLOY_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh packages
          printf '%s\n' "$KEY" > ~/.ssh/shared_models_ci
          chmod 600 ~/.ssh/shared_models_ci
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null

          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/shared_models_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git clone --depth 1 --branch master \
              git@github.com:godzyken/shared_models.git \
              "packages/shared_models"

          echo "→ packages/shared_models OK"
          rm -f ~/.ssh/shared_models_ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test
