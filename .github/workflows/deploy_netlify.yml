name: Deploy Web to Netlify

on:
  push:
    branches: [ "master", "main" ]

jobs:
  deploy_netlify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shared_models
        env:
          KEY: ${{ secrets.SHARED_MODELS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${KEY:-}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/shared_models_ci
            chmod 600 ~/.ssh/shared_models_ci
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i $HOME/.ssh/shared_models_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
              git clone --depth 1 --branch master \
                git@github.com:godzyken/shared_models.git \
                "../shared_models"
            rm -f ~/.ssh/shared_models_ci
          else
            git clone --depth 1 https://github.com/godzyken/shared_models.git "../shared_models" || true
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --web-renderer canvaskit

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './build/web'
          production-branch: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
