name: egote_services_v2
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment:
  sdk: ^3.8.0

dependencies:
  cupertino_icons: ^1.0.8
  go_router: ^17.4.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  sentry_flutter: ^8.2.0
  flutter_plugin_android_lifecycle: ^2.0.20
  shared_preferences: ^2.2.3
  firebase_auth: ^4.20.0
  firebase_core: ^2.32.0
  firebase_database: ^10.5.7
  geoflutterfire2: 2.3.15
  connectycube_sdk: ^3.0.3
  connectivity_plus: ^7.3.1
  freezed_annotation: ^3.1.0
  supabase_flutter: ^2.16.0
  crypto: ^3.0.6

  fpdart: ^1.1.0
  json_annotation: ^4.9.0
  #  uni_links: 0.5.1
  uuid: ^4.4.0
  #  url_launcher: ^6.2.6
  cloud_firestore: ^4.17.5
  sqflite: ^2.3.3+1
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  comment_box: ^0.0.18
  settings_ui: ^3.0.1
  formz: ^0.8.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  flutter_advanced_drawer: ^1.3.6
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  flex_color_scheme: ^8.4.0
  flex_color_picker: '>=3.4.1 <4.0.0'
  flutter_local_notifications: ^22.3.0
  firebase_messaging: ^14.9.4
  device_info_plus: ^10.1.0
  package_info_plus: ^9.0.1
  universal_io: ^2.2.2
  #  flutter_app_badger: ^1.5.0
  emoji_picker_flutter: ^4.5.3
  cached_network_image: ^3.3.1
  file_picker: ^11.0.3
  photo_view: ^0.15.0
  firebase_ui_auth: ^1.14.0
  sign_in_with_apple: ^6.1.1
  datadog_flutter_plugin: ^2.5.0
  mocktail: ^1.0.3
  hive: ^2.2.3
  badges: ^3.1.2
  multi_link_text: ^0.0.5
  google_generative_ai: ^0.4.1
  #  url_launcher_android: ^6.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  go_router_builder: ^4.4.0
  build_runner: ^2.4.10
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1
  flutter_flavorizr: ^2.2.3
  flutter_test:
    sdk: flutter
  flutter_gen_runner: ^5.5.0+1
  icons_launcher: ^3.1.0

dependency_overrides:
  intl: ^0.20.0
  meta: any
  web: ^1.0.0
  rxdart: ^0.28.0

flutter_gen:
  output: lib/gen
  integrations:
    flutter_svg: true

flutter:
  assets:
    - assets/lottie/image/
    - assets/lottie/archive/
    - assets/lottie/archive/amenagement/exterieur/piscines/
    - assets/json/development.config.json
    - assets/json/local.config.json
    - assets/json/production.config.json
    - assets/fonts/
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
          style: italic

  uses-material-design: true
  generate: true

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:

  flavors:
    local:
      app:
        name: "egote_services_v2 Local"

      android:
        applicationId: "com.godzy.egote_services_v2.local"
      ios:
        bundleId: "com.godzy.egote_services_v2.local"

    development:
      app:
        name: "egote_services_v2 Development"

      android:
        applicationId: "com.godzy.egote_services_v2.dev"
      ios:
        bundleId: "com.godzy.egote_services_v2.dev"

    production:
      app:
        name: "Example Production"

      android:
        applicationId: "com.godzy.egote_services_v2"
      ios:
        bundleId: "com.godzy.egote_services_v2"